spring.application.name=northlight-academy
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
server.error.include-stacktrace=never
# JWT_SECRET has no default on purpose: the app refuses to start without it.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
app.jwt.refresh-days=${JWT_REFRESH_DAYS:14}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.storage.dir=${STORAGE_DIR:./uploads}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.password-reset.log-links=${DEV_LOG_RESET_LINKS:false}
